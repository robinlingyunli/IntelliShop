services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellishop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-intellishop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
